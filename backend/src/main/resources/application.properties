spring.application.name=skyline-backend

server.port=8080

# SQL Server
# Update these values for your local SQL Server.
spring.datasource.url=jdbc:mysql://localhost:3306/skyline
spring.datasource.username=skyline
spring.datasource.password=${SKYLINE_DB_PASSWORD}

# JPA
#spring.jpa.hibernate.ddl-auto=validate         //Once we introduce Flyway, switch it to validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# We will enable/configure Flyway when we create the first database schema.
spring.flyway.enabled=false